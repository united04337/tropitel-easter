<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Easter | The Grand Resort</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* LUXURY COLOR PALETTE */
            --clr-gold: #C5A059; /* Brushed Antique Gold */
            --clr-cream: #FDFBF7; 
            --overlay: rgba(20, 25, 20, 0.35); /* Richer, dark tint */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background-color: #000; /* Black base for better contrast during blur */
            overflow: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- THE BACKGROUND --- */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Tints the image and loads your file */
            background-image: linear-gradient(var(--overlay), var(--overlay)), 
                              url('tropitel images/hook.jpeg');
            background-size: cover;
            background-position: center;
            
            /* INCREASED BLUR: Starting very deep */
            filter: blur(100px) scale(1.2); 
            transition: filter 3.5s cubic-bezier(0.22, 1, 0.36, 1), 
                        transform 3.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* The 'Big Hit' Reveal State */
        .hero-bg.reveal {
            filter: blur(6px) scale(1.05); /* Keeps the background dreamy and high-end */
        }

        /* --- THE TEXT CONTENT --- */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 2.5s ease-out 0.8s, transform 2.5s ease-out 0.8s;
        }

        .hero-content.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .main-title {
            color: var(--clr-gold);
            font-size: clamp(3.5rem, 12vw, 9rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            line-height: 0.9;
            margin-bottom: 0.5rem;
            /* Added a subtle glow to make the gold feel alive */
            text-shadow: 0 0 30px rgba(197, 160, 89, 0.4);
        }

        .sub-title {
            color: rgba(255, 255, 255, 0.85); /* Slightly transparent white */
            font-size: 1.1rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            font-family: sans-serif; /* Modern contrast to the serif title */
            font-weight: 300;
            margin-top: 1.5rem;
        }

        /* Decorative Line */
        .line {
            width: 60px;
            height: 1px;
            background: var(--clr-gold);
            margin: 0 auto;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-bg" id="bg"></div>

        <div class="hero-content" id="content">
            <h1 class="main-title">HAPPY<br>EASTER</h1>
            <div class="line"></div>
            <p class="sub-title">Tanta Grand Resort</p>
        </div>
    </section>

    <script>
        window.addEventListener('load', () => {
            const bg = document.getElementById('bg');
            const content = document.getElementById('content');

            // Trigger the reveal
            setTimeout(() => {
                bg.classList.add('reveal');
                content.classList.add('reveal');
            }, 400);
        });
    </script>

</body>
</html>
