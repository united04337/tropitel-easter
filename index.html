<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropitel Dahab Oasis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;600&display=swap" rel="stylesheet">

    <style>
        /* --- Setup & Colors --- */
        :root {
            --clr-gold: #D4AF37; /* Metallic Gold */
            --clr-cream: #FDFBF7; /* Soft White/Eggshell */
            --bg-overlay: rgba(0, 0, 0, 0.3); /* Darkens image slightly for text readability */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Playfair Display', serif;
            background-color: var(--clr-cream);
            overflow-x: hidden;
        }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- The Blurry Background --- */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Using a high-quality placeholder for a luxury hotel lobby */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('tropitel image/hook.jpeg');
            background-size: cover;
            background-position: center;
            
            /* Initial State: Very Blurry */
            filter: blur(40px) scale(1.1); /* Scale prevents white edges on blur */
            transition: filter 3s ease-out, transform 3s ease-out;
        }

        /* --- When the 'active' class is added via JS --- */
        .hero-bg.reveal {
            filter: blur(8px) scale(1); /* Keeps it slightly blurry for that 'fancy' depth */
        }

        /* --- Text Content --- */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: var(--clr-gold);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s ease-out 1s, transform 2s ease-out 1s; /* Delayed fade-in */
        }

        .hero-content.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .main-title {
            font-size: clamp(3rem, 10vw, 8rem); /* Responsive font size */
            font-weight: 300;
            letter-spacing: 0.2em;
            line-height: 1.2;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        .sub-title {
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: white;
            font-family: sans-serif;
            font-weight: 300;
        }

        /* --- Decorative Ornament --- */
        .ornament {
            width: 100px;
            height: 1px;
            background: var(--clr-gold);
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-bg" id="bg"></div>

        <div class="hero-content" id="content">
            <h1 class="main-title">HAPPY<br>EASTER</h1>
            <div class="ornament"></div>
            <p class="sub-title">The Grand Resort & Spa</p>
        </div>
    </section>

    <script>
        // Triggering the 'Reveal' animation once the page loads
        window.addEventListener('DOMContentLoaded', () => {
            const bg = document.getElementById('bg');
            const content = document.getElementById('content');

            // Small timeout to ensure the browser is ready
            setTimeout(() => {
                bg.classList.add('reveal');
                content.classList.add('reveal');
            }, 500);
        });
    </script>

</body>
</html>
